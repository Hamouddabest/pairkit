name: PairKit
options:
  bundleIdPrefix: com.hamoud
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PairKit:
    type: application
    platform: iOS
    sources:
      - path: PairKit
    info:
      path: PairKit/Info.plist
      properties:
        CFBundleDisplayName: PairKit
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: PairKit pairs this iPhone with itself and talks to it over your local VPN to install apps.
        NSBonjourServices: ["_remotepairing-pairable-host._tcp"]
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamoud.pairkit
        SWIFT_OBJC_BRIDGING_HEADER: PairKit/PairKit-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: ["$(SRCROOT)/../target/aarch64-apple-ios/release"]
        OTHER_LDFLAGS: ["-lpairkit_core", "-lresolv", "-lc++"]
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
