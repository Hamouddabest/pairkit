name: HelloGuest
options:
  bundleIdPrefix: com.hamoud
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HelloGuest:
    type: application
    platform: iOS
    sources:
      - path: HelloGuest
    info:
      path: HelloGuest/Info.plist
      properties:
        CFBundleDisplayName: Hello Guest
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamoud.helloguest
        TARGETED_DEVICE_FAMILY: "1"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
