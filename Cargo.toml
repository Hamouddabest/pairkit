[package]
name = "pairkit"
version = "0.1.0"
edition = "2021"

[dependencies]
# "ring" turns on rustls with the ring crypto backend. The build failed without a TLS
# feature, because idevice's code needs one.
idevice = { version = "0.1.64", default-features = false, features = ["remote_pairing", "ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "fs", "io-util"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
