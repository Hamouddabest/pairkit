name: Build pairkit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Native ARM Linux runner (free for public repos). Output runs in Open Minis.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust and musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools build-essential cmake perl clang
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-unknown-linux-musl

      - name: Build static binary
        env:
          RUSTFLAGS: "-C target-feature=+crt-static -C relocation-model=static"
        run: cargo build --release --target aarch64-unknown-linux-musl

      - name: Package
        run: |
          cp target/aarch64-unknown-linux-musl/release/pairkit pairkit-aarch64
          file pairkit-aarch64 || true
          ls -l pairkit-aarch64

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest pairkit-aarch64 --title "pairkit latest" --notes "Static aarch64 Linux build for Open Minis."
