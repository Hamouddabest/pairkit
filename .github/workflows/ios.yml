name: Build iOS app

on:
  push:
    branches: [main]
    paths: ["ios/**", "src/**", "Cargo.toml", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Rust (iOS target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios
          rustup default stable

      - name: Patch isideload (skip its app-ID count pre-check; Apple still enforces the real limit)
        run: |
          cargo fetch || true
          d=$(ls -d ~/.cargo/registry/src/*/isideload-0.5.2 | head -1)
          cp -r "$d" vendor-isideload
          perl -0pi -e 's/if app_ids_to_register\.len\(\) > available\.try_into\(\)\? \{/if false \&\& app_ids_to_register.len() > available.try_into()? {/' vendor-isideload/src/sideload/application.rs
          grep -c "if false && app_ids_to_register" vendor-isideload/src/sideload/application.rs
          printf '\n[patch.crates-io]\nisideload = { path = "vendor-isideload" }\n' >> Cargo.toml

      - name: Build the Rust core
        run: cargo build --release --lib --target aarch64-apple-ios

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build the app (unsigned)
        run: |
          xcodebuild -project ios/PairKit.xcodeproj -scheme PairKit -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Build the Hello Guest test app (unsigned)
        run: |
          cd ios/guest && xcodegen generate && cd ../..
          xcodebuild -project ios/guest/HelloGuest.xcodeproj -scheme HelloGuest -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath buildguest \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package the IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PairKit.app Payload/
          zip -qry PairKit.ipa Payload
          ls -l PairKit.ipa
          mkdir -p PayloadG
          cp -R buildguest/Build/Products/Release-iphoneos/HelloGuest.app PayloadG/
          (cd PayloadG && mkdir Payload && mv HelloGuest.app Payload/ && zip -qry ../HelloGuest.ipa Payload)
          ls -l HelloGuest.ipa

      - name: Publish to the "app" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app PairKit.ipa HelloGuest.ipa --title "PairKit app" --notes "Unsigned IPA. Install it with SideStore/AltStore."
