name: Build iOS app

on:
  push:
    branches: [main]
    paths: ["ios/**", "src/**", "Cargo.toml", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Rust (iOS target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios
          rustup default stable

      - name: Build the Rust core
        run: cargo build --release --lib --target aarch64-apple-ios

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build the app (unsigned)
        run: |
          xcodebuild -project ios/PairKit.xcodeproj -scheme PairKit -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package the IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PairKit.app Payload/
          zip -qry PairKit.ipa Payload
          ls -l PairKit.ipa

      - name: Publish to the "app" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app PairKit.ipa --title "PairKit app" --notes "Unsigned IPA. Install it with SideStore/AltStore."
