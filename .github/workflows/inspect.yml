name: Inspect isideload

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Fetch isideload source
        run: |
          rustup toolchain install stable --profile minimal
          cargo new probe && cd probe
          cargo add isideload@0.5.2 || cargo add isideload
          cargo fetch
          d=$(ls -d ~/.cargo/registry/src/*/isideload-* | head -1)
          echo "DIR=$d"
          for f in src/auth/builder.rs src/auth/apple_account.rs src/sideload/builder.rs src/sideload/sideloader.rs src/sideload/install.rs src/util/callbacks.rs src/util/device.rs src/util/storage.rs src/util/fs_storage.rs src/anisette/mod.rs src/anisette/remote_v3/mod.rs src/dev/teams.rs src/dev/certificates.rs src/sideload/cert_identity.rs; do
            echo "=== $f ==="; cat "$d/$f"
          done
