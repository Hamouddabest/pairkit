name: Inspect isideload

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Fetch isideload source
        run: |
          rustup toolchain install stable --profile minimal
          cargo new probe && cd probe
          cargo add isideload@0.5.2 || cargo add isideload
          cargo fetch
          d=$(ls -d ~/.cargo/registry/src/*/isideload-* | head -1)
          echo "DIR=$d"
          d=$(ls -d ~/.cargo/registry/src/*/isideload-* | head -1)
          i=$(ls -d ~/.cargo/registry/src/*/idevice-0.1.* | sort -V | tail -1)
          for f in src/sideload/mod.rs src/auth/mod.rs src/dev/mod.rs; do echo "=== isideload/$f ==="; cat "$d/$f"; done
          echo "=== isideload apple_account pub items ==="; grep -n "pub \(async \)\?fn\|pub struct\|pub enum" "$d/src/auth/apple_account.rs"
          echo "=== isideload TwoFactor types ==="; sed -n 55,110p "$d/src/auth/apple_account.rs"
          echo "=== isideload sideload_app ==="; grep -rn "pub async fn sideload_app\|pub async fn install_app\|pub async fn sign_app" "$d/src"
          for f in src/tunnel.rs src/tcp/mod.rs src/services/rsd.rs src/remote_pairing/rp_pairing_file.rs; do echo "=== idevice/$f ==="; cat "$i/$f"; done
          echo "=== idevice tcp dir ==="; ls "$i/src/tcp"
          echo "=== jktcp ==="; j=$(ls -d ~/.cargo/registry/src/*/jktcp-* | sort -V | tail -1); echo $j; ls $j/src; grep -n "pub \(async \)\?fn\|pub struct" $j/src/*.rs | head -60
