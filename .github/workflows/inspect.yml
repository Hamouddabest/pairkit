name: Inspect isideload

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Fetch sources
        run: |
          rustup toolchain install stable --profile minimal
          cargo new probe && cd probe
          cargo add isideload@0.5.2
          cargo fetch
          d=$(ls -d ~/.cargo/registry/src/*/isideload-* | head -1)
          echo "=== application.rs ==="; sed -n 150,300p "$d/src/sideload/application.rs"
